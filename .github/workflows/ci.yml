name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install 7-Zip CLI (7z archive fixtures)
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Unit tests + coverage gate
        run: npm run test:gate
      - name: Build single-file HTML
        run: npm run build
      - name: Verify committed bundle is fresh
        run: git diff --exit-code -- log-triage.html
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run e2e
      - name: Upload built HTML
        uses: actions/upload-artifact@v4
        with:
          name: log-triage-html
          path: log-triage.html

  # (Pages deployment lives in the release job above: the release commit is
  # pushed with GITHUB_TOKEN, which does not trigger workflow runs, so a
  # separate pages job would deploy a permanently stale bundle.)

  # Pages is deployed HERE (not in a separate job) because the release commit
  # is pushed with GITHUB_TOKEN, which never triggers another workflow — a
  # standalone pages job would keep serving a stale bundle forever.
  release:
    needs: test-build-e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Automatic version bump from conventional commits
        run: node tools/bump.mjs --ci
      - name: Rebuild bundle with the release version
        run: npm run build
      - name: Push release commit and tag
        run: |
          git config user.name "log-triage-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "No version bump needed."
          else
            VERSION=$(node -p "require('./package.json').version")
            git add package.json README.md docs/changelog.md log-triage.html
            git commit -m "chore(release): v$VERSION"
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin HEAD "v$VERSION"
          fi
      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble site (index.html)
        run: mkdir -p site && cp log-triage.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
